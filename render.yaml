services:
  - type: web
    name: telegram-nft-offers
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TRANSFER_URL
        value: https://t.me/Autooffersgift
